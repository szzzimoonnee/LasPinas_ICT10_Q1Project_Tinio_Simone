<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SKU Generator</title>

    <link rel="stylesheet"
          href="https://pyscript.net/releases/2024.6.1/core.css">

    <script type="module"
            src="https://pyscript.net/releases/2024.6.1/core.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar">

        <div class="brand">
            ICT 10 Q1 Project
        </div>

        <div>
            <a href="index.html">Receipt Generator</a>
            <a href="sku.html">SKU Generator</a>
        </div>

    </nav>


    <main class="page">

        <div class="container">

            <section class="card">

                <div class="card-header">
                    <h1>SKU Generator</h1>
                    <p>Create a unique product code</p>
                </div>

                <div class="card-body">

                    <label for="category">
                        📦 Category
                    </label>

                    <select id="category">

                        <option value="Perishables">
                            Perishables
                        </option>

                        <option value="Beverages">
                            Beverages
                        </option>

                        <option value="Snacks">
                            Snacks
                        </option>

                        <option value="Clothing">
                            Clothing
                        </option>

                        <option value="Electronics">
                            Electronics
                        </option>

                    </select>


                    <label for="product_name">
                        🏷️ Product Name
                    </label>

                    <input
                        type="text"
                        id="product_name"
                        placeholder="e.g. Bottled Water"
                    >


                    <label for="quantity">
                        📦 Stock Quantity
                    </label>

                    <input
                        type="number"
                        id="quantity"
                        min="0"
                        placeholder="e.g. 50"
                    >


                    <button py-click="SKU_generator">
                        Generate SKU
                    </button>


                    <div id="sku_output" class="output">
                        Your generated SKU will appear here.
                    </div>

                </div>

            </section>

        </div>

    </main>


    <div class="footer">
        ICT 10 • 1st Quarter Project
    </div>


    <!-- MAIN PYTHON FILE -->
    <script type="py" src="./main.py"></script>

</body>
</html>
